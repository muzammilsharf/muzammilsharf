name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=muzammilsharf&show_icons=true&include_all_commits=true&theme=tokyonight
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top langs card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=muzammilsharf&layout=compact&theme=tokyonight
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card 1
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=muzammilsharf&repo=RagPortfolioChatbot&theme=tokyonight
          path: profile/pin1.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card 2
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=muzammilsharf&repo=AI-Based-Morning-Briefing-Assistant&theme=tokyonight
          path: profile/pin2.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate wakatime card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          options: username=1ee85a76-9e12-49c1-b688-86a53aad5a6f&theme=tokyonight
          path: profile/wakatime.svg
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

      - name: Update last updated date
        run: |
          sed -i "s|<!-- LAST_UPDATED -->.*|<!-- LAST_UPDATED -->$(date -u +'%B %d, %Y')|" README.md

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg README.md
          git commit -m "Update README cards" || exit 0
          git push